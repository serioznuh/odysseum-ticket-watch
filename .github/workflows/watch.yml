# Cloud half of the watcher: reminder passes + supervision.
#
# The daily Pathé check runs on a home machine via scripts/local-check.sh
# (launchd), NOT here: Akamai blocks www.pathe.fr/api from GitHub's
# datacenter IPs (verified 2026-07-06 — 403 on every request that succeeds
# from a residential IP). The local check pushes state/state.json back to
# this repo; this workflow reads it to alert if the local check stops running
# (stale state), and to stand in as the *failover* for the 24h/2h/15min
# pre-sale reminders — the local half owns those, because this cron is far too
# unreliable to own them: measured over the 9.6 days to 2026-09-03 it ran 100
# times of the 920 that "*/15" implies (10.9%), median gap 58 min, max 11.5 h
# (OTW-15).
#
# NOTE on private repos: the 15-min pass bills ~1 GitHub Actions minute per
# run (~2900 min/month), above the 2000-min free tier. Keep the repo public
# (free), or relax to "*/30".
name: ticket-watch

on:
  schedule:
    - cron: "*/15 * * * *"  # reminder + supervision pass (exits fast when nothing is due)
  workflow_dispatch:
    inputs:
      mode:
        description: "check, remind, or test (test = send a Telegram test message)"
        default: "check"
      dry_run:
        description: "log alerts instead of sending"
        type: boolean
        default: false

permissions:
  contents: write  # to persist state/state.json back to the repo

concurrency:
  group: ticket-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # A healthy pass takes ~20 s. During a GitHub Actions incident (2026-08-06:
    # "Failed to resolve action download info / Service Unavailable") setup can
    # instead hang for 15+ min, and because of the concurrency group above that
    # blocks the next cron firings until they are cancelled — one GitHub blip
    # becomes a burst of failure/cancellation emails. Cap it so a sick run dies
    # fast and the 15-min cadence self-heals on the next firing.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Decide mode
        id: mode
        run: |
          MODE=remind
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Run watcher (${{ steps.mode.outputs.mode }})
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "test" ]; then
            python -m watcher --test-telegram
          else
            # --reminder-grace-minutes makes this pass the reminder FAILOVER,
            # never the owner: it only sends a reminder whose window opened 25+
            # min ago, i.e. one the local half (launchd, every 15 min) already
            # missed. 25 > 15 leaves margin for a slightly late local run.
            # due_reminders floors that wait at the local firing interval, so
            # the failover can never reach a rung before the Mac's worst-case
            # first firing; the 15-min warning is only one interval wide, so it
            # stays the Mac's alone and the "sale is open" ping is what covers a
            # Mac asleep through it (OTW-15). Changing this number is covered by
            # a test against config.toml's offsets and the launchd plist.
            # It applies to check mode too — reminders are computed in both
            # modes, and a manual dispatch from here is still the cloud.
            python -m watcher --mode "${{ steps.mode.outputs.mode }}" --reminder-grace-minutes 25 ${{ inputs.dry_run == true && '--dry-run' || '' }}
          fi

      - name: Persist state
        if: ${{ inputs.dry_run != true }}
        run: |
          if [ -n "$(git status --porcelain state/state.json)" ]; then
            git config user.name "ticket-watch-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state/state.json
            git commit -m "state: $(date -u +%FT%TZ) [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
