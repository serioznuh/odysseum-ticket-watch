# Cloud half of the watcher: cloud-safe news + reminder failover + supervision.
#
# The daily Pathé check runs on a home machine via scripts/local-check.sh
# (launchd), NOT here: Akamai blocks www.pathe.fr/api from GitHub's
# datacenter IPs (verified 2026-07-06 — 403 on every request that succeeds
# from a residential IP). The local check pushes live JSON through the
# dedicated runtime-state ref; this workflow reads Google News (plus explicitly
# opted-in cloud pages), alerts if the local check stops, and stands in as the
# *failover* for the 24h/2h/15min pre-sale reminders — the local half owns those,
# because this cron is far too
# unreliable to own them: measured over the 9.6 days to 2026-09-03 it ran 100
# times of the 920 that "*/15" implies (10.9%), median gap 58 min, max 11.5 h
# (OTW-15).
#
# NOTE on private repos: the 15-min pass bills ~1 GitHub Actions minute per
# run (~2900 min/month), above the 2000-min free tier. Keep the repo public
# (free), or relax to "*/30".
name: ticket-watch

on:
  schedule:
    - cron: "*/15 * * * *"  # cloud-safe news + reminder failover + supervision
  workflow_dispatch:
    inputs:
      mode:
        description: "check, remind, or test (test = send a Telegram test message)"
        default: "check"
      dry_run:
        description: "log alerts instead of sending"
        type: boolean
        default: false

permissions:
  contents: write  # to persist the dedicated runtime-state ref

concurrency:
  group: ticket-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # A healthy pass takes ~20 s. During a GitHub Actions incident (2026-08-06:
    # "Failed to resolve action download info / Service Unavailable") setup can
    # instead hang for 15+ min, and because of the concurrency group above that
    # blocks the next cron firings until they are cancelled — one GitHub blip
    # becomes a burst of failure/cancellation emails. Cap it so a sick run dies
    # fast and the 15-min cadence self-heals on the next firing.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Decide mode
        id: mode
        run: |
          MODE=remind
          WITH_NEWS=--with-news
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
            WITH_NEWS=
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "with_news=$WITH_NEWS" >> "$GITHUB_OUTPUT"

      - name: Synchronize runtime state (before)
        continue-on-error: true
        run: python -m watcher.state_sync sync

      # A quiet watcher pass may make no Telegram call. This read-only probe
      # makes "successful scheduled run" cover the bot token and target chat,
      # without sending a liveness message every 15 minutes (OTW-09).
      - name: Validate Telegram credentials (no message)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m watcher --state .cache/state-sync/state.json --check-telegram

      - name: Run watcher (${{ steps.mode.outputs.mode }})
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "test" ]; then
            python -m watcher --state .cache/state-sync/state.json --test-telegram
          else
            # --reminder-grace-minutes makes this pass the reminder FAILOVER,
            # never the owner: it only sends a reminder whose window opened 25+
            # min ago, i.e. one the local half (launchd, every 5 min) already
            # missed. 25 > 5 leaves margin for a slightly late local run.
            # due_reminders floors that wait at the local firing interval, so
            # the failover can never reach a rung before the Mac's worst-case
            # first firing; the 25-min grace exceeds the 15-min warning window,
            # so it stays the Mac's alone and the opening-time ping covers a
            # Mac asleep through it (OTW-15). Changing this number is covered by
            # a test against config.toml's offsets and the launchd plist.
            # It applies to check mode too — reminders are computed in both
            # modes, and a manual dispatch from here is still the cloud.
            # Scheduled remind passes add --with-news; manual modes stay as
            # selected, so a manual check keeps its existing full-check path.
            python -m watcher --state .cache/state-sync/state.json --mode "${{ steps.mode.outputs.mode }}" --reminder-grace-minutes 25 ${{ steps.mode.outputs.with_news }} ${{ inputs.dry_run == true && '--dry-run' || '' }}
          fi

      - name: Synchronize runtime state (after)
        if: ${{ always() && inputs.dry_run != true }}
        run: python -m watcher.state_sync sync
